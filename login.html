<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="Sign in to your Northstar account." />
    <meta
      name="keywords"
      content="Northstar, login, account, furniture, interior design"
    />

    <title>Login | Northstar</title>

    <link rel="shortcut icon" href="favicon.png" />

    <!-- Bootstrap CSS -->
    <link href="css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Main stylesheet -->
    <link href="css/style.css" rel="stylesheet" />

    <style>
      /* ================================
           LOGIN PAGE
        ================================= */

      .login-section {
        min-height: 75vh;
        display: flex;
        align-items: center;
        padding: 80px 0;
        background: #eff2f1;
      }

      .login-wrapper {
        max-width: 480px;
        margin: 0 auto;
      }

      .login-card {
        background: #ffffff;
        padding: 45px;
        border-radius: 10px;
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
      }

      .login-header {
        text-align: center;
        margin-bottom: 35px;
      }

      .login-header h1 {
        font-size: 32px;
        font-weight: 600;
        color: #2f2f2f;
        margin-bottom: 10px;
      }

      .login-header p {
        color: #6c757d;
        margin-bottom: 0;
      }

      .login-form .form-label {
        font-weight: 500;
        color: #2f2f2f;
        margin-bottom: 8px;
      }

      .login-form .form-control {
        height: 52px;
        border-radius: 5px;
        border: 1px solid #d6d6d6;
        padding: 0 15px;
      }

      .login-form .form-control:focus {
        border-color: #3b5d50;
        box-shadow: 0 0 0 0.15rem rgba(59, 93, 80, 0.15);
      }

      .password-container {
        position: relative;
      }

      .password-container .form-control {
        padding-right: 50px;
      }

      .password-toggle {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        border: none;
        background: transparent;
        color: #777;
        cursor: pointer;
        padding: 5px;
      }

      .password-toggle:hover {
        color: #3b5d50;
      }

      .login-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 18px 0 25px;
        font-size: 14px;
      }

      .remember-me {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #555;
      }

      .remember-me input {
        accent-color: #3b5d50;
      }

      .forgot-password {
        color: #3b5d50;
        text-decoration: none;
      }

      .forgot-password:hover {
        text-decoration: underline;
      }

      .login-button {
        width: 100%;
        height: 52px;
        border: none;
        border-radius: 5px;
        background: #3b5d50;
        color: #ffffff;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .login-button:hover {
        background: #314e43;
        color: #ffffff;
      }

      .register-link {
        text-align: center;
        margin-top: 25px;
        color: #6c757d;
        font-size: 15px;
      }

      .register-link a {
        color: #3b5d50;
        font-weight: 600;
        text-decoration: none;
      }

      .register-link a:hover {
        text-decoration: underline;
      }

      .back-home {
        text-align: center;
        margin-top: 25px;
      }

      .back-home a {
        color: #6c757d;
        text-decoration: none;
        font-size: 14px;
      }

      .back-home a:hover {
        color: #3b5d50;
      }

      /* ================================
           MOBILE
        ================================= */

      @media (max-width: 575px) {
        .login-section {
          padding: 50px 15px;
        }

        .login-card {
          padding: 30px 22px;
        }

        .login-header h1 {
          font-size: 27px;
        }
      }
    </style>
  </head>

  <body>
    <!-- =================================
     NAVIGATION
================================= -->

    <nav
      class="custom-navbar navbar navbar-expand-md navbar-dark bg-dark"
      aria-label="Northstar navigation bar"
    >
      <div class="container">
        <a class="navbar-brand" href="index.html"> Northstar<span>.</span> </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarsNorthstar"
          aria-controls="navbarsNorthstar"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarsNorthstar">
          <ul class="custom-navbar-nav navbar-nav ms-auto mb-2 mb-md-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html"> Home </a>
            </li>

            <li>
              <a class="nav-link" href="shop.html"> Shop </a>
            </li>

            <li>
              <a class="nav-link" href="contact.html"> Contact us </a>
            </li>
          </ul>

          <!-- USER + CART -->

          <ul class="custom-navbar-cta navbar-nav mb-2 mb-md-0 ms-5">
            <li>
              <a class="nav-link" href="login.html" aria-label="Login">
                <img src="images/user.svg" alt="Login" />
              </a>
            </li>

            <li>
              <a class="nav-link" href="cart.html" aria-label="Shopping cart">
                <img src="images/cart.svg" alt="Cart" />
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- =================================
     LOGIN SECTION
================================= -->

    <section class="login-section">
      <div class="container">
        <div class="login-wrapper">
          <div class="login-card">
            <!-- HEADER -->

            <div class="login-header">
              <h1>Welcome Back</h1>

              <p>Sign in to your Northstar account</p>
            </div>

            <!-- FORM -->

            <form class="login-form" action="#" method="POST">
              <!-- EMAIL -->

              <div class="mb-4">
                <label for="email" class="form-label"> Email Address </label>

                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="Enter your email address"
                  autocomplete="email"
                  required
                />
              </div>

              <!-- PASSWORD -->

              <div class="mb-3">
                <label for="password" class="form-label"> Password </label>

                <div class="password-container">
                  <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                  />

                  <button
                    type="button"
                    class="password-toggle"
                    id="togglePassword"
                    aria-label="Show password"
                  >
                    <i class="fa-solid fa-eye"></i>
                  </button>
                </div>
              </div>

              <!-- OPTIONS -->

              <div class="login-options">
                <label class="remember-me">
                  <input type="checkbox" name="remember" id="remember" />

                  <span> Remember me </span>
                </label>

                <a href="forgot-password.html" class="forgot-password">
                  Forgot Password?
                </a>
              </div>

              <!-- LOGIN -->

              <button type="submit" class="login-button">Sign In</button>
            </form>

            <!-- REGISTER -->

            <div class="register-link">
              Don't have an account?

              <a href="reg.html"> Create an account </a>
            </div>

            <!-- BACK -->

            <div class="back-home">
              <a href="index.html">
                <i class="fa-solid fa-arrow-left me-1"></i>

                Back to Home
              </a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- =================================
     FOOTER
================================= -->

    <footer class="footer-section">
      <div class="container">
        <div class="border-top copyright">
          <div class="row pt-4">
            <div class="col-lg-6">
              <p class="mb-2 text-center text-lg-start">
                Copyright &copy;

                <script>
                  document.write(new Date().getFullYear());
                </script>

                Northstar. All Rights Reserved.
              </p>
            </div>

            <div class="col-lg-6 text-center text-lg-end">
              <ul class="list-unstyled d-inline-flex ms-auto">
                <li class="me-4">
                  <a href="#"> Terms &amp; Conditions </a>
                </li>

                <li>
                  <a href="#"> Privacy Policy </a>
                </li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </footer>

    <!-- =================================
     JAVASCRIPT
================================= -->

    <script src="js/bootstrap.bundle.min.js"></script>

    <script>
      const togglePassword = document.getElementById("togglePassword");

      const password = document.getElementById("password");

      togglePassword.addEventListener("click", function () {
        const isPassword = password.type === "password";

        password.type = isPassword ? "text" : "password";

        const icon = this.querySelector("i");

        icon.classList.toggle("fa-eye", !isPassword);

        icon.classList.toggle("fa-eye-slash", isPassword);
      });
    </script>
  </body>
</html>
